name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q zorion-android.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        working-directory: zorion-android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ZORION-apk
          path: zorion-android/app/build/outputs/apk/debug/*.apk
